<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="Wavedash Spring Jam 2026" />
        <meta property="og:image" content="https://tiaratum.com/preview.png" />
        <meta property="og:type" content="website" />
        <title>Wavedash Spring Jam 2026</title>
        <script>
            var loadingProgress = 0;
            var loadingAmountComplete = 14; // Adjust this based on the number of loading steps you have
            async function incLoading(amount = 1) {
                loadingProgress += amount;
                console.log("loading progress = " + loadingProgress);
                Wavedash = await window.Wavedash;
                if (Wavedash != undefined) {
                    Wavedash.updateLoadProgressZeroToOne(loadingProgress / loadingAmountComplete);
                }
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/Index.ts"></script>
        <div id="pointer"></div>
    </body>
</html>
